name: Alex Brinson
description: description: [Home](https://alexjbrinson.github.io) | [Waveguides](https://alexjbrinson.github.io/Waveguides) | [nBody Simulator](https://alexjbrinson.github.io/nBodySim) | [Light House Problem](https://alexjbrinson.github.io/LightHouse) | [nEDM](https://alexjbrinson.github.io/nEDM)
theme: jekyll-theme-slate
# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: 'highlight'
